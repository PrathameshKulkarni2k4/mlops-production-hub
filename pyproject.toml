[project]
name = "mlops-production-hub"
version = "0.1.0"
description = "End-to-end production MLOps system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "config/jupyter_lab_config.py",
]

[tool.ruff.lint]
select=["E", "F", "W", "I"]

[tool.black]
line-length = 120
target-version = ['py310']
